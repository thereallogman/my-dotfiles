source = /home/mint/.config/hypr/colors.conf

background {
    monitor =
    path = /home/mint/Pictures/Wallpapers/citadel.png
    blur_passes = 2
    blur_size = 7
}

input-field {
    monitor =
    size = 200, 50
    outline_thickness = 3
    font_family = JetBrainsMono Nerd Font
    font_color = $text
    inner_color = $fill
    outer_color = $outline
    dots_size = 0.33
    dots_spacing = 0.15
    fade_on_empty = false
    ignore_empty_input = true
}

label {
    monitor =
    text = cmd[update:1000] echo "$(date +'%I:%M %p')"
    color = $text
    font_size = 64
    font_family = JetBrainsMono Nerd Font
    position = 0, 80
    halign = center
    valign = center
}
